<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tokens/usbt-lolo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>FUSDT Claim - 10 Free FUSDT Related Token Claim Reward</title>
    <meta name="description" content="FUSDT Related Token Claim Reward - Claim your promotional giveaway reward instantly." />
    <meta property="og:title" content="FUSDT Claim - FUSDT Related Token Claim Reward" />
    <meta property="og:description" content="FUSDT Related Token Claim Reward - Claim your 10 Free promotional token giveaway reward." />
    <meta property="og:type" content="website" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="FUSDT Claim - FUSDT Related Token Claim Reward" />
    <meta property="twitter:description" content="FUSDT Related Token Claim Reward - Claim your 10 Free promotional token giveaway reward." />
    <script>
      (function() {
        var host = window.location.hostname.toLowerCase();
        var isFusdt = host.includes('fusdt');
        var symbol = isFusdt ? 'FUSDT' : 'USBT';
        var icon = isFusdt ? '/tokens/fusdt-lolo.svg' : '/tokens/usbt-lolo.png';
        var type = isFusdt ? 'image/svg+xml' : 'image/png';
        var pageTitle = symbol + ' Claim - 10 Free ' + symbol + ' Related Token Claim Reward';
        var pageDesc = symbol + ' Related Token Claim Reward - Claim your promotional giveaway reward instantly.';
        
        document.title = pageTitle;

        function setMeta(selector, attrName, attrVal, contentVal) {
          var el = document.querySelector(selector);
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attrName, attrVal);
            document.head.appendChild(el);
          }
          el.setAttribute('content', contentVal);
        }

        setMeta('meta[name="description"]', 'name', 'description', pageDesc);
        setMeta('meta[property="og:title"]', 'property', 'og:title', pageTitle);
        setMeta('meta[property="og:description"]', 'property', 'og:description', pageDesc);
        setMeta('meta[property="twitter:title"]', 'property', 'twitter:title', pageTitle);
        setMeta('meta[property="twitter:description"]', 'property', 'twitter:description', pageDesc);

        var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = type;
        link.rel = 'icon';
        link.href = icon;
        document.getElementsByTagName('head')[0].appendChild(link);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
